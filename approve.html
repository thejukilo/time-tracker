<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Approve Items - Time Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-light">
  <div id="approveApp" class="container py-5">
    <div class="card mx-auto shadow-sm" style="max-width: 600px;">
      <div class="card-body">
        <h3 class="text-center mb-4">Approve Suggested Items</h3>

        <div v-if="isLoading" class="text-center my-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p>Loading items...</p>
        </div>

        <div v-else>
          <div v-for="(list, type) in draftItems" :key="type" class="mb-4">
            <h5 class="text-capitalize">{{ type }}</h5>
            <ul class="list-group">
              <li v-for="(item, index) in list" :key="index" class="list-group-item d-flex justify-content-between align-items-center">
                {{ item }}
                <button class="btn btn-sm btn-success" @click="approveItem(type, item)">Approve</button>
              </li>
              <li v-if="!list.length" class="list-group-item text-muted">No draft items</li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          isLoading: false,
          draftItems: {
            categories: [],
            instruments: [],
            projects: []
          }
        };
      },
      mounted() {
        this.loadDraftItems();
      },
      methods: {
        loadDraftItems() {
          this.isLoading = true;
          google.script.run.withSuccessHandler(data => {
            this.draftItems = data;
            this.isLoading = false;
          }).getDraftItems();
        },
        approveItem(type, item) {
          if (!confirm(`Approve "${item}"?`)) return;
          google.script.run.withSuccessHandler(() => {
            this.draftItems[type] = this.draftItems[type].filter(i => i !== item);
          }).approveItem(type, item);
        }
      }
    }).mount('#approveApp');
  </script>
</body>
</html>

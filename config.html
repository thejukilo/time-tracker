<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-light">
  <div id="configApp" class="container py-5">
    <h2 class="text-center mb-4">Preferences</h2>
    <form @submit.prevent="savePreferences">
      <div class="mb-4">
        <label class="form-label fw-bold">Visible Projects</label>
        <div class="form-check" v-for="p in projects" :key="p">
          <input class="form-check-input" type="checkbox" :id="'project-' + p" :value="p" v-model="visibleProjects">
          <label class="form-check-label" :for="'project-' + p">{{ p }}</label>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Visible Instruments</label>
        <div class="form-check" v-for="i in instruments" :key="i">
          <input class="form-check-input" type="checkbox" :id="'instrument-' + i" :value="i" v-model="visibleInstruments">
          <label class="form-check-label" :for="'instrument-' + i">{{ i }}</label>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Visible Departments</label>
        <div class="form-check" v-for="d in departments" :key="d">
          <input class="form-check-input" type="checkbox" :id="'department-' + d" :value="d" v-model="visibleDepartments">
          <label class="form-check-label" :for="'department-' + d">{{ d }}</label>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary w-100" type="submit">Save Preferences</button>
        <button @click="goToPage()" class="btn btn-sm btn-outline-secondary">
   back
</button>
      </div>

      <div v-if="saveSuccess" class="alert alert-success text-center mt-3">
        Preferences saved!
      </div>
    </form>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          email: '',
          projects: [],
          instruments: [],
          departments: [],
          visibleProjects: [],
          visibleInstruments: [],
          visibleDepartments: [],
          saveSuccess: false,
          scriptUrl: 'https://script.google.com/a/macros/roche.com/s/AKfycbzmk9Be_6wY46DYcafktRW6on0UeO86I72fWd7XMvuROLNMBppo1pZPNkEy-YshjFAt/exec',
        };
      },
      methods: {
        goToPage() {
        window.top.location.href= 'site.google.com/roche.com/rmdtimetracker/index'
},
        savePreferences() {
          google.script.run.withSuccessHandler(() => {
            this.saveSuccess = true;
            setTimeout(() => this.saveSuccess = false, 3000);
          }).saveUserSettingsToSheet({
            email: this.email,
            visibleProjects: this.visibleProjects,
            visibleInstruments: this.visibleInstruments,
            visibleDepartments: this.visibleDepartments
          });
        },
        setUserSettings(settings) {
          this.visibleProjects = settings.visibleProjects || [];
          this.visibleInstruments = settings.visibleInstruments || [];
          this.visibleDepartments = settings.visibleDepartments || [];
        }
      },
      mounted() {
        google.script.run.withSuccessHandler(email => {
          this.email = email;
          google.script.run.withSuccessHandler(this.setUserSettings).getUserSettingsFromSheet(email);
        }).getUserEmail();

        google.script.run.withSuccessHandler(data => this.projects = data).getProjectsFromSheet();
        google.script.run.withSuccessHandler(data => this.instruments = data).getInstrumentsFromSheet();
        google.script.run.withSuccessHandler(data => this.departments = data).getDepartmentsFromSheet();
      }
    }).mount('#configApp');
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header><span class="mark">◷</span><div><strong>Time Tracker</strong><small id="identity">Loading…</small></div></header>
    <p id="notice" class="notice" hidden></p>
    <section id="setup" class="card" hidden><strong>One-time setup</strong><p>Add your deployed Apps Script <code>/exec</code> URL in <code>config.js</code>, then reload this extension.</p></section>
    <section id="tracker" hidden>
      <div class="timer-card"><span id="timerStatus">Ready to track</span><output id="elapsed">00:00:00</output><button id="startStop" class="primary">Start timer</button></div>
      <form id="entryForm" hidden>
        <label>Department<select id="department" required></select></label>
        <label>Category<select id="category" required></select></label>
        <label id="projectWrap" hidden>Project <span>optional</span><select id="project"></select></label>
        <label id="instrumentWrap" hidden>Instrument <span>optional</span><select id="instrument"></select></label>
        <label>Hours<input id="hours" type="number" min="0.01" max="24" step="0.01" required></label>
        <div class="actions"><button id="discard" type="button" class="secondary">Discard</button><button id="save" class="primary">Save entry</button></div>
      </form>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
